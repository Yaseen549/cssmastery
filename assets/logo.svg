<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="logoBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="88" height="88" rx="22" fill="url(#logoBrandGrad)" />
    <rect x="1" y="1" width="86" height="86" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" />
    <path d="M 28 22 L 60 22" stroke="#FED7AA" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Left Brace { -->
    <path d="M 34 26 C 26 26 24 30 24 37 C 24 43 23 45 18 48 C 23 51 24 53 24 59 C 24 66 26 70 34 70" 
          stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#logoGlow)" />
    <!-- Right Brace } -->
    <path d="M 54 26 C 62 26 64 30 64 37 C 64 43 65 45 70 48 C 65 51 64 53 64 59 C 64 66 62 70 54 70" 
          stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#logoGlow)" />
    <!-- Center Declaration Colon -->
    <circle cx="44" cy="41" r="3.5" fill="#FFF7ED" />
    <circle cx="44" cy="55" r="3.5" fill="#FED7AA" />
  </g>

  <!-- Brand Typography -->
  <text x="112" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#18181B" letter-spacing="-0.04em">
    CSS<tspan fill="#EA580C">Master</tspan>
  </text>
  <text x="112" y="76" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#71717A" letter-spacing="0.08em">
    COMPLETE LEARNING PLATFORM
  </text>

  <!-- Version Pill Badge -->
  <g transform="translate(305, 30)">
    <rect width="64" height="24" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2" />
    <text x="32" y="16" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#C2410C" text-anchor="middle" letter-spacing="0.04em">
      CSS3+
    </text>
  </g>
</svg>
